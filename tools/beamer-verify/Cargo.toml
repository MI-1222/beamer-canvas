[package]
name = "beamer-verify"
version = "0.1.0"
edition = "2024"

[dependencies]
beamer-core = { version = "0.1.0", path = "../../crates/beamer-core" }
beamer-parser = { version = "0.1.0", path = "../../crates/beamer-parser" }
beamer-renderer = { version = "0.1.0", path = "../../crates/beamer-renderer" }
clap = { version = "4.6.7", features = ["derive"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.0"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full"] }
