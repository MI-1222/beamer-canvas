[package]
name = "beamer-renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
beamer-core = { version = "0.1.0", path = "../beamer-core" }
command-group = { version = "5.0.1", features = ["with-tokio"] }
moka = { version = "0.12.16", features = ["sync"] }
pdfium-render = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["process", "macros", "rt-multi-thread", "io-util", "sync", "time"] }
tokio-util = "0.7.20"
webp = "0.3.1"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
